  }
  </script>
  <!--
    Cuando Discord proxyea /retro → retro.camiloh.co, la página se ve en:
      https://APP.discordsays.com/retro/
    Sin <base>, una URL sin slash final (/retro) hace que ./css resuelva a /css
    (raíz del bot) y todo falla con 404.
  -->
  <script>
    (function () {
      var host = location.hostname || "";
      var path = location.pathname || "/";
      var inDiscord =
        /\.discordsays\.com$/i.test(host) ||
        /\.discordapigateway\.com$/i.test(host);
      if (inDiscord) document.documentElement.classList.add("in-discord");
      if (inDiscord && path.indexOf("/retro") === 0) {
        var b = document.createElement("base");
        b.href = "/retro/";
        document.head.appendChild(b);
      }
    })();
  </script>
