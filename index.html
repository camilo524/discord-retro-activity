<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro Activity</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      background: #0d0d0d;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* ===== PANTALLA DE SELECCIÓN ===== */
    #menu {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #111 0%, #1a1a2e 100%);
      z-index: 20;
      padding: 20px;
      overflow-y: auto;
    }
    #menu h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #57f287, #5865f2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #menu p {
      color: #aaa;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      max-width: 700px;
      width: 100%;
    }
    .game-card {
      background: #1e1e2e;
      border: 2px solid #2a2a3a;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .game-card:hover {
      border-color: #5865f2;
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(88, 101, 242, 0.3);
    }
    .game-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
      background: #000;
      margin-bottom: 8px;
    }
    .game-card span {
      font-size: 0.85rem;
      font-weight: 600;
    }
    .game-card .core {
      font-size: 0.7rem;
      color: #888;
      margin-top: 2px;
    }

    /* ===== EMULADOR ===== */
    #game-container {
      position: absolute;
      inset: 0;
      display: none;
    }
    #game {
      width: 100%;
      height: 100%;
    }

    /* Botón volver */
    #btn-back {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 30;
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid #444;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      display: none;
    }
    #btn-back:hover { background: rgba(88,101,242,0.8); }

    /* Loading */
    #loading {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 25;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- MENÚ DE SELECCIÓN -->
  <div id="menu">
    <h1>🕹️ Retro Activity</h1>
    <p>Elige un juego · Multijugador automático con amigos de la sala</p>
    <div class="games-grid" id="games-grid">
      <!-- Se llena con JavaScript -->
    </div>
  </div>

  <!-- LOADING -->
  <div id="loading">Cargando emulador...</div>

  <!-- BOTÓN VOLVER -->
  <button id="btn-back" onclick="backToMenu()">← Cambiar juego</button>

  <!-- CONTENEDOR DEL EMULADOR -->
  <div id="game-container">
    <div id="game"></div>
  </div>

  <!-- LISTA DE JUEGOS (fácil de ampliar) -->
  <script>
    // ============================================
    //  AQUÍ AÑADES MÁS JUEGOS
    // ============================================
    const GAMES = [
      {
        id: 1,
        name: "Contra",
        core: "nes",
        rom: "./roms/contra.nes",
        cover: "https://upload.wikimedia.org/wikipedia/en/4/4a/Contra_cover.jpg" // o pon tu propia imagen
      },
      {
        id: 2,
        name: "Super Mario Bros",
        core: "nes",
        rom: "./roms/super-mario-bros.nes",
        cover: "" // deja vacío si no tienes cover
      },
      {
        id: 3,
        name: "The Legend of Zelda",
        core: "nes",
        rom: "./roms/zelda.nes",
        cover: ""
      },
      // Ejemplo SNES:
      // {
      //   id: 4,
      //   name: "Super Mario World",
      //   core: "snes",
      //   rom: "./roms/super-mario-world.sfc",
      //   cover: ""
      // },
    ];

    // Renderizar tarjetas
    const grid = document.getElementById("games-grid");
    GAMES.forEach(game => {
      const card = document.createElement("div");
      card.className = "game-card";
      card.innerHTML = `
        ${game.cover 
          ? `<img src="${game.cover}" alt="${game.name}" onerror="this.style.display='none'">` 
          : `<div style="width:100%;aspect-ratio:1;background:#222;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:8px">🎮</div>`
        }
        <span>${game.name}</span>
        <div class="core">${game.core.toUpperCase()}</div>
      `;
      card.onclick = () => startGame(game);
      grid.appendChild(card);
    });

    // ============================================
    //  LÓGICA DEL EMULADOR + NETPLAY
    // ============================================
    let currentGame = null;

    function startGame(game) {
      currentGame = game;

      document.getElementById("menu").style.display = "none";
      document.getElementById("loading").style.display = "flex";
      document.getElementById("btn-back").style.display = "block";
      document.getElementById("game-container").style.display = "block";

      // Limpiar emulador anterior si existe
      const gameDiv = document.getElementById("game");
      gameDiv.innerHTML = "";

      // Configuración de EmulatorJS
      window.EJS_player = "#game";
      window.EJS_core = game.core;
      window.EJS_gameUrl = game.rom;
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      window.EJS_startOnLoaded = true;
      window.EJS_gameID = game.id;                    // único por juego

      // ===== NETPLAY AUTOMÁTICO =====
      // Usamos el instanceId de Discord como sala
      // Así todos los que estén en la misma Activity se unen a la misma room
      const roomId = window.discordInstanceId || ("solo-" + Date.now());

      window.EJS_netplayServer = "https://netplay.emulatorjs.org/";
      window.EJS_netplayICEServers = [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
        { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
      ];

      // Nombre del jugador (si tenemos Discord)
      if (window.discordUser) {
        window.EJS_playerName = window.discordUser.username;
      }

      window.EJS_onGameStart = function () {
        document.getElementById("loading").style.display = "none";
        console.log("Juego iniciado:", game.name, "| Room:", roomId);
      };

      // Cargar el loader de EmulatorJS (solo una vez)
      if (!window.emulatorjsLoaded) {
        const script = document.createElement("script");
        script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
        script.onload = () => { window.emulatorjsLoaded = true; };
        document.body.appendChild(script);
      } else {
        // Si ya estaba cargado, forzamos reinicio
        location.reload(); // solución simple y fiable
      }
    }

    function backToMenu() {
      location.reload(); // forma más limpia de reiniciar el emulador
    }

    // Esperar a que el SDK esté listo (opcional, no bloquea)
    window.addEventListener("discord-ready", () => {
      console.log("Discord listo → instanceId disponible para netplay");
    });
  </script>

  <!-- SDK Discord -->
  <script type="module" src="./app.js"></script>
</body>
</html>
