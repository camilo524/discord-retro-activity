<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camulador</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="icon" type="image/png" href="./assets/favicon.png">
</head>
<body>
  <div id="menu">
    <h1>🕹️ CAMULADOR</h1>
    <p class="subtitle">Elige un juego · Controles en (☰)</p>
    <p class="music-credit">🎵 Música: <strong>4RM0R</strong></p>
    <div class="games-grid" id="games-grid"></div>
  </div>
  
  <audio id="menu-music" src="./assets/NEOby4RM0R.mp3" loop preload="auto"></audio>

  <div id="loading">
    <div class="spinner"></div>
    <p id="loading-text">Cargando emulador...</p>
    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <p class="progress-label" id="progress-label"></p>
  </div>

  <button id="btn-back">← Cambiar juego</button>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script src="./js/games.js?v=05"></script>
  <script src="./js/rom-cache.js?v=2"></script>
  <script src="./js/netplay.js?v=1"></script>
  <script src="./js/menu-music.js?v=1"></script>
  <script src="./js/emulator.js?v=05"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
