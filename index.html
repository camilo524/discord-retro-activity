<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro Activity</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script>
    // Configuración de EmulatorJS
    EJS_player = "#game";
    EJS_core = "nes";
    EJS_gameUrl = "./roms/contra.nes";          // ← asegúrate que el archivo exista
    EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    EJS_startOnLoaded = true;
    EJS_color = "#000000";
  </script>

  <!-- Loader estático (más fiable dentro de Discord) -->
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

  <!-- SDK de Discord (opcional por ahora) -->
  <script type="module" src="./app.js"></script>
</body>
</html>
