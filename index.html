<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro Activity</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0a0a0f;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    /* ===== MENÚ ===== */
    #menu {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      z-index: 30;
      padding: 24px 16px;
      overflow-y: auto;
    }
    #menu h1 {
      font-size: 1.9rem;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #57f287, #5865f2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #menu .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 28px;
      text-align: center;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 14px;
      max-width: 620px;
      width: 100%;
    }
    .game-card {
      background: rgba(30, 30, 50, 0.85);
      border: 2px solid #2a2a45;
      border-radius: 14px;
      padding: 12px 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      user-select: none;
    }
    .game-card:hover {
      border-color: #5865f2;
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(88, 101, 242, 0.25);
    }
    .game-card:active { transform: translateY(-2px); }
    .game-card .cover {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 10px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .game-card .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .game-card .name {
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.25;
    }
    .game-card .core {
      font-size: 0.68rem;
      color: #64748b;
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ===== LOADING ===== */
    #loading {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 40;
      gap: 16px;
    }
    #loading .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid #222;
      border-top-color: #5865f2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    /* ===== EMULADOR ===== */
    #game-container {
      position: absolute;
      inset: 0;
      display: none;
      background: #000;
    }
    #game {
      width: 100%;
      height: 100%;
    }

    /* Botón volver */
    #btn-back {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 50;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border: 1px solid #444;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      display: none;
      backdrop-filter: blur(6px);
      transition: background 0.15s;
    }
    #btn-back:hover {
      background: rgba(88, 101, 242, 0.85);
      border-color: #5865f2;
    }
  </style>
</head>
<body>

  <!-- MENÚ DE SELECCIÓN -->
  <div id="menu">
    <h1>🕹️ Retro Activity</h1>
    <p class="subtitle">Elige un juego · Multijugador automático con la sala</p>
    <div class="games-grid" id="games-grid"></div>
  </div>

  <!-- LOADING -->
  <div id="loading">
    <div class="spinner"></div>
    <p>Cargando emulador...</p>
  </div>

  <!-- BOTÓN CAMBIAR JUEGO -->
  <button id="btn-back" onclick="backToMenu()">← Cambiar juego</button>

  <!-- CONTENEDOR DEL JUEGO -->
  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    // =============================================
    //  LISTA DE JUEGOS  (añade más aquí)
    // =============================================
    const GAMES = [
      {
        id: 1,
        name: "Contra",
        core: "nes",
        rom: "./roms/contra.nes",
        emoji: "🔫"
      },
      {
        id: 2,
        name: "Super Mario Bros",
        core: "nes",
        rom: "./roms/super-mario-bros.nes",
        emoji: "🍄"
      },
      {
        id: 3,
        name: "The Legend of Zelda",
        core: "nes",
        rom: "./roms/zelda.nes",
        emoji: "🗡️"
      },
      // Ejemplo para añadir más:
      // {
      //   id: 4,
      //   name: "Super Mario World",
      //   core: "snes",
      //   rom: "./roms/super-mario-world.sfc",
      //   emoji: "🦕"
      // },
    ];

    // Renderizar tarjetas
    const grid = document.getElementById("games-grid");
    GAMES.forEach(game => {
      const card = document.createElement("div");
      card.className = "game-card";
      card.innerHTML = `
        <div class="cover">${game.emoji || "🎮"}</div>
        <div class="name">${game.name}</div>
        <div class="core">${game.core}</div>
      `;
      card.addEventListener("click", () => startGame(game));
      grid.appendChild(card);
    });

    // =============================================
    //  LÓGICA DEL EMULADOR
    // =============================================
    function startGame(game) {
      // Mostrar loading
      document.getElementById("menu").style.display = "none";
      document.getElementById("loading").style.display = "flex";
      document.getElementById("btn-back").style.display = "none";
      document.getElementById("game-container").style.display = "block";

      // Configuración de EmulatorJS
      window.EJS_player = "#game";
      window.EJS_core = game.core;
      window.EJS_gameUrl = game.rom;
      window.EJS_pathtodata = "/emulatorjs/stable/data/";   // ruta mapeada
      window.EJS_startOnLoaded = true;
      window.EJS_color = "#000000";
      window.EJS_gameID = game.id;                         // necesario para netplay

      // ===== MULTIJUGADOR AUTOMÁTICO =====
      // Usamos el instanceId de Discord como identificador de sala
      const roomId = window.discordInstanceId || ("solo-" + Date.now());
      window.EJS_netplayServer = "https://netplay.emulatorjs.org/";
      window.EJS_netplayICEServers = [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        {
          urls: "turn:openrelay.metered.ca:80",
          username: "openrelayproject",
          credential: "openrelayproject"
        },
        {
          urls: "turn:openrelay.metered.ca:443",
          username: "openrelayproject",
          credential: "openrelayproject"
        }
      ];

      if (window.discordUser?.username) {
        window.EJS_playerName = window.discordUser.username;
      }

      window.EJS_onGameStart = function () {
        document.getElementById("loading").style.display = "none";
        document.getElementById("btn-back").style.display = "block";
        console.log("✅ Juego iniciado:", game.name, "| Room:", roomId);
      };

      // Cargar el loader de EmulatorJS
      if (!window.__ejsLoaded) {
        const script = document.createElement("script");
        script.src = "/emulatorjs/stable/data/loader.js";
        script.onload = () => { window.__ejsLoaded = true; };
        script.onerror = () => {
          document.getElementById("loading").innerHTML = `
            <p style="color:#f87171">Error cargando el emulador</p>
            <p style="font-size:0.85rem;color:#94a3b8">Revisa el URL Mapping de /emulatorjs</p>
          `;
        };
        document.body.appendChild(script);
      } else {
        // Si ya estaba cargado, la forma más fiable es recargar
        // (EmulatorJS no tiene un API limpio para cambiar de ROM)
        location.reload();
      }
    }

    function backToMenu() {
      // La forma más limpia y estable de volver al menú
      location.reload();
    }

    // Cuando el SDK de Discord esté listo
    window.addEventListener("discord-ready", () => {
      console.log("Discord listo → instanceId disponible para netplay");
    });
  </script>

  <script type="module" src="./app.js"></script>
</body>
</html>
