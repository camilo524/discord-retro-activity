<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro Activity</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script>
    EJS_player = "#game";
    EJS_core = "nes";
    EJS_gameUrl = "./roms/contra.nes";
    // ← Ahora usamos la ruta mapeada
    EJS_pathtodata = "/emulatorjs/stable/data/";
    EJS_startOnLoaded = true;
    EJS_color = "#000000";
  </script>

  <!-- También cambiamos el src del loader -->
  <script src="/emulatorjs/stable/data/loader.js"></script>

  <script type="module" src="./app.js"></script>
</body>
</html>
