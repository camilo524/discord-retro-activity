<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camulador</title>
  <!--
    Cuando Discord proxyea /retro → retro.camiloh.co, la página se ve en:
      https://APP.discordsays.com/retro/
    Sin <base>, una URL sin slash final (/retro) hace que ./css resuelva a /css
    (raíz del bot) y todo falla con 404.
  -->
  <script>
    (function () {
      var host = location.hostname || "";
      var path = location.pathname || "/";
      var inDiscord =
        /\.discordsays\.com$/i.test(host) ||
        /\.discordapigateway\.com$/i.test(host);
      if (inDiscord && path.indexOf("/retro") === 0) {
        var b = document.createElement("base");
        b.href = "/retro/";
        document.head.appendChild(b);
      }
    })();
  </script>
  <link rel="stylesheet" href="./css/styles.css?v=04" />
  <link rel="icon" type="image/png" href="./assets/favicon.png" />
</head>
<body>
  <div id="menu">
    <div class="menu-inner">
      <h1>🕹️ CAMULADOR</h1>
      <p class="subtitle">Elige un juego · Controles en (☰)</p>
      <p class="music-credit">🎵 Música: <strong>4RM0R</strong></p>
      <div class="games-grid" id="games-grid"></div>
    </div>
  </div>

  <audio id="menu-music" src="./assets/NEOby4RM0R.mp3" loop preload="auto"></audio>

  <div id="loading">
    <div class="spinner"></div>
    <p id="loading-text">Cargando emulador...</p>
    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <p class="progress-label" id="progress-label"></p>
  </div>

  <button id="btn-back">← Cambiar juego</button>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script src="./js/games.js?v=08"></script>
  <script src="./js/save-states.js?v=2"></script>
  <script src="./js/rom-cache.js?v=3"></script>
  <script src="./js/netplay.js?v=8"></script>
  <script src="./js/netplay-ws.js?v=2"></script>
  <script src="./js/menu-music.js?v=2"></script>
  <script src="./js/emulator.js?v=13"></script>
  <!-- SDK: NO usar bare specifier @discord/... (rompe sin bundler) -->
  <script type="module" src="./app.js?v=03"></script>
</body>
</html>
