<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camulador</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="menu">
    <h1>🕹️ CAMULADOR</h1>
    <p class="subtitle">Elige un juego · Controles en (☰)</p>
    <div class="games-grid" id="games-grid"></div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <p id="loading-text">Cargando emulador...</p>
    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <p class="progress-label" id="progress-label"></p>
  </div>

  <button id="btn-back">← Cambiar juego</button>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script src="./js/games.js"></script>
  <script src="./js/emulator.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
